<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="Figura sin imagen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171d"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="rgba(255,255,255,.05)"/>
    </pattern>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#dots)"/>
  <rect x="18" y="18" width="564" height="764" fill="none" stroke="#8b5bff" stroke-width="8"/>
  <!-- silueta de figura sobre base -->
  <g fill="none" stroke="#8b5bff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="300" cy="612" rx="150" ry="34"/>
    <circle cx="300" cy="250" r="52"/>
    <path d="M300 302 L300 470 M300 340 L232 420 M300 340 L368 420 M300 470 L250 596 M300 470 L350 596"/>
  </g>
  <text x="300" y="700" text-anchor="middle" font-family="Anton, Arial Black, sans-serif" font-size="46" fill="#f3efe4">FIGURA</text>
  <text x="300" y="742" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" fill="#9a9aa5">Imagen no disponible</text>
  <rect x="40" y="40" width="190" height="42" fill="#8b5bff"/>
  <text x="135" y="69" text-anchor="middle" font-family="Bangers, Anton, sans-serif" font-size="24" fill="#0c0c0e" letter-spacing="2">GEEKPOINT</text>
</svg>
