<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="Caja de exhibición vacía">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20202c"/>
      <stop offset="0.55" stop-color="#14141f"/>
      <stop offset="1" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a38"/>
      <stop offset="1" stop-color="#131320"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="16%" r="60%">
      <stop offset="0" stop-color="#8b5bff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8b5bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fondo / pared trasera -->
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#spot)"/>

  <!-- piso en perspectiva -->
  <polygon points="84,506 516,506 600,800 0,800" fill="url(#floor)"/>
  <polygon points="84,506 516,506 600,800 0,800" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>

  <!-- paredes internas en sombra -->
  <polygon points="0,0 84,0 84,800 0,800" fill="#000000" fill-opacity=".38"/>
  <polygon points="516,0 600,0 600,800 516,800" fill="#000000" fill-opacity=".38"/>
  <rect x="0" y="0" width="600" height="120" fill="#000000" fill-opacity=".34"/>

  <!-- filo de acento interior + marco exterior -->
  <rect x="10" y="10" width="580" height="780" fill="none" stroke="#8b5bff" stroke-width="4" opacity=".85"/>
  <rect x="0" y="0" width="600" height="800" fill="none" stroke="#0c0c0e" stroke-width="24"/>

  <!-- rótulo del expositor -->
  <text x="300" y="742" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" letter-spacing="3" fill="#9a9aa5">VITRINA DE EXHIBICIÓN</text>
  <rect x="205" y="40" width="190" height="42" fill="#8b5bff"/>
  <text x="300" y="69" text-anchor="middle" font-family="Bangers, Anton, sans-serif" font-size="24" fill="#0c0c0e" letter-spacing="2">GEEKPOINT</text>
</svg>
